[project]
name = "platosim"
version = "3.7.1"
description = "PlatoSim: An end-to-end PLATO camera simulator"
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "pyaml>=21.10.1,<22",
    "h5py>=3.6.0,<4",
    "tqdm>=4.65.0,<5",
    "colorama>=0.4.4,<0.5",
    "prettytable>=3.2.0,<4",
    "shapely>=2.0.0,<3",
    "DateTime>=4.4,<5",
    "numpy>1.24.4,<2",
    "pandas>=2.2,<3",
    "scipy>=1.15.0,<2",
    "scikit-image>=0.22,<1",
    "astropy>=6.0,<7",
    "matplotlib>=3.5.1,<4",
    "ipywidgets>=8.0.2,<9",
    "notebook>=6.4.6,<6.4.7",
    "jupyter-client==7.3.2",
    "traitlets==5.9.0",
    "tornado==6.1.0",
    "jupyter>=1.1.1,<2",
    "holoviews>=1.21.0,<2",
]

[dependency-groups]

platonium = [
    "argos>=0.4.4,<0.5",
    "pyarrow>=13.0.0,<14",
    "zipp>=3.7.0,<4",
    "natsort>=8.2.0,<9",
    "llvmlite>=0.40.0,<0.41",
    "numba>=0.6",
    "astroquery>=0.4.6,<0.4.8",
    "LDTk>=1.7.0,<2",
    "wotan>=1.10,<2",
    "batman-package>=2.4.8,<3",
    "transitleastsquares>=1.0.31,<2",
    "PyAstronomy>=0.17.1,<0.18",
    "statsmodels>=0.13.5,<0.14",
    "joblib>=1.3.2,<2",
    "lmfit>=1.2.2,<2",
    "ligo.skymap==2.4.1rc1",
]

pipeline = [
    "Cython>=0.29.28,<0.30",
    "mpi4py>=3.1.3,<4",
]

docs = [
    "Sphinx>=5.0.0,<6",
    "renku-sphinx-theme>=0.5.0,<0.6",
]

